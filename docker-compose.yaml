services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: authkit_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - authkit_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d authkit_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Transaction pooling that keeps no prepared statements, for the
  # transaction-pooler journey (AUTHKIT_TEST_PGBOUNCER_URL).
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DATABASE_URL: postgres://admin:admin_password@postgres:5432/authkit_db
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_PREPARED_STATEMENTS: "0"
      MAX_CLIENT_CONN: "500"
    ports:
      - "127.0.0.1:36432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:36379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  authkit_postgres_data:
