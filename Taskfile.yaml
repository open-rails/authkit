# Task runner config (https://taskfile.dev). Replaces the old Makefile.
# Run `task --list` to see available tasks.
version: '3'

vars:
  # Pinned sqlc version; `go run` keeps the tool out of the library's go.mod.
  # Override via the SQLC_VERSION env var or `task SQLC_VERSION=vX.Y.Z sqlc`.
  SQLC_VERSION: '{{.SQLC_VERSION | default "v1.31.1"}}'
  SQLC: 'go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}'
  # sqlc vet's db-prepare rule PREPAREs every query against a real database.
  # Defaults to the compose Postgres; test-db-ready applies the schema directly.
  SQLC_DATABASE_URL: '{{.SQLC_DATABASE_URL | default "postgres://admin:admin_password@127.0.0.1:35432/authkit_db?sslmode=disable"}}'
  # The compose Redis; Redis-backed stores and the limiter are tested against it.
  TEST_REDIS_URL: '{{.TEST_REDIS_URL | default "redis://127.0.0.1:36379/0"}}'
  # Every go.work module (root + adapters/gin + adapters/riverjobs). `./...`
  # stops at each nested go.mod; the import-path pattern spans the workspace.
  PKGS: github.com/open-rails/authkit/...

# Exported to every task's commands (Makefile: `export SQLC_DATABASE_URL`).
env:
  SQLC_DATABASE_URL: '{{.SQLC_DATABASE_URL}}'

tasks:
  test-db-up:
    desc: Start the shared Postgres + Redis integration-test dependencies
    cmds:
      - |
        docker compose up -d --wait postgres redis

  test-db-ready:
    desc: Start Postgres and apply AuthKit migrations for integration/sqlc tasks
    deps: [test-db-up]
    cmds:
      - AUTHKIT_DATABASE_URL='{{.SQLC_DATABASE_URL}}' go run ./cmd/authkit-migrate

  sqlc:
    desc: Regenerate type-safe query code and lint queries (generate + vet, always as a pair)
    deps: [test-db-ready]
    cmds:
      - '{{.SQLC}} generate'
      - '{{.SQLC}} vet'

  sqlc-check:
    desc: 'CI guard: fail if committed generated code drifts from queries (modified or untracked files)'
    deps: [sqlc]
    cmds:
      - git diff --exit-code -- internal/db
      - test -z "$(git status --porcelain -- internal/db)"

  test:
    desc: Run the full test suite (race detector) against the compose Postgres and Redis; DB-backed tests fail rather than skip
    env:
      AUTHKIT_TEST_DATABASE_URL: '{{.SQLC_DATABASE_URL}}'
      AUTHKIT_TEST_REDIS_URL: '{{.TEST_REDIS_URL}}'
      AUTHKIT_TEST_REQUIRE_DB: '1'
    cmds:
      - go test -race -p 1 {{.PKGS}}

  test-ci:
    desc: '`task test` with a JSON report (.reports/go-test.json), then fail if any test skipped'
    env:
      AUTHKIT_TEST_DATABASE_URL: '{{.SQLC_DATABASE_URL}}'
      AUTHKIT_TEST_REDIS_URL: '{{.TEST_REDIS_URL}}'
      AUTHKIT_TEST_REQUIRE_DB: '1'
    cmds:
      - mkdir -p .reports
      # Readable log: drop the per-test RUN/PASS chatter that -json (implies -v) adds.
      - |
        set -o pipefail
        go test -race -p 1 -json {{.PKGS}} | tee .reports/go-test.json \
          | jq -Rrj 'fromjson? | select(.Action == "output" or .Action == "build-output") | .Output | select(test("^(=== (RUN|PAUSE|CONT|NAME)|\\s*--- PASS)") | not)'
      - task: test-skip-gate

  test-skip-gate:
    desc: Fail if .reports/go-test.json records a skipped test; CI must execute every test
    cmds:
      - |
        skipped=$(jq -r 'select(.Action == "skip" and .Test != null) | "\(.Package) \(.Test)"' .reports/go-test.json)
        if [ -n "$skipped" ]; then
          printf 'skipped tests (every test must run in CI):\n%s\n' "$skipped"
          exit 1
        fi
        echo "skip gate: 0 skipped, $(jq -r 'select(.Action == "pass" and .Test != null) | .Test' .reports/go-test.json | wc -l) passed"
        jq -ser '
          . as $events |
          {
            authhttp: (([
              "TestAccountAdmissionWorkflow", "TestAuthenticationContinuationWorkflow",
              "TestProviderAuthenticationWorkflow", "TestFactorManagementWorkflow"
            ] | map(. + "/memory", . + "/redis")) + [
              "TestNativeCredentialWorkflow/memory/passkey", "TestNativeCredentialWorkflow/memory/device_key",
              "TestNativeCredentialWorkflow/redis/passkey", "TestNativeCredentialWorkflow/redis/device_key",
              "TestDelegatedTokenRoute_CertificateBoundEndToEnd", "TestDelegatedTokenRoute_KIDRotationReconciliation"
            ]),
            embedded: ["TestBootstrapWorkflow", "TestGroupLifecycleWorkflow"],
            authkitmigrate: ["TestFreshSchemaWorkflow"]
          } | to_entries |
          [ .[] | .key as $package | .value[] | . as $test |
            select(any($events[]; .Action == "pass" and
              .Package == ("github.com/open-rails/authkit/" + $package) and
              .Test == $test) | not) | ($package + "/" + $test) ] |
          if length == 0 then "workflow gate: all required lifecycle suites ran"
          else error("missing required workflows: " + join(", ")) end
        ' .reports/go-test.json

  test-fast:
    desc: Fast DB-free smoke (race detector, no Postgres). DB-backed tests skip.
    env:
      AUTHKIT_TEST_DATABASE_URL: ''
    cmds:
      - go test -race {{.PKGS}}

  test-browser:
    desc: Run the real two-site browser cookie workflow against PostgreSQL and Redis
    deps: [test-db-ready]
    env:
      AUTHKIT_TEST_DATABASE_URL: '{{.SQLC_DATABASE_URL}}'
      AUTHKIT_TEST_REDIS_URL: '{{.TEST_REDIS_URL}}'
      AUTHKIT_TEST_REQUIRE_DB: '1'
    cmds:
      - |
        set -o pipefail
        mkdir -p .reports
        AUTHKIT_PLAYWRIGHT_MODULE="${AUTHKIT_PLAYWRIGHT_MODULE:-$PWD/authhttp/testdata/node_modules/@playwright/test}" \
          go test -race -tags browser ./authhttp -run '^TestCookieLoginBrowserTwoSites$' -count=1 -json \
          | tee .reports/browser-test.json | jq -rj 'select(.Action == "output") | .Output'
        jq -se 'any(.[]; .Action == "pass" and .Test == "TestCookieLoginBrowserTwoSites")' .reports/browser-test.json

  test-query-contracts:
    desc: Run semantic query-contract tests against a migrated scratch Postgres
    deps: [test-db-up]
    cmds:
      - |
        QUERY_TEST_DATABASE_URL="${QUERY_TEST_DATABASE_URL:-{{.SQLC_DATABASE_URL}}}" \
          go test -count=1 ./internal/db/querytest -run '^TestQueryContracts$'

  test-query-perf:
    desc: Run query plan/performance tests (build tag queryperf; weekly CI lane, never part of `task test`) against a migrated scratch Postgres
    deps: [test-db-up]
    cmds:
      - |
        QUERY_TEST_DATABASE_URL="${QUERY_TEST_DATABASE_URL:-{{.SQLC_DATABASE_URL}}}" \
        QUERY_PERF_SCALE="${QUERY_PERF_SCALE:-100000}" \
          go test -count=1 -tags queryperf ./internal/db/querytest -run '^TestQueryPerformance$'
