# Example bootstrap manifest: initial users, root roles and remote applications.

users:
  - email: operator@example.com
    username: operator
    email_verified: true
    password:
      plaintext: "change-me"
    root_role: owner

remote_applications:
  - slug: tensorhub-runtime
    issuer: https://tensorhub.example
    jwks_uri: https://tensorhub.example/.well-known/jwks.json
    enabled: true

# Dev-only fixtures. AuthKit parses this section but never applies it; the
# host reads it at boot and must honor it only in its own dev environment.
# dev:
#   static_entitlements: [pro, beta]
