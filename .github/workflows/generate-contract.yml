name: Generate contract artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to generate (verify source-sha.txt before applying)
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: off
      GOMAXPROCS: '2'
      AUTHKIT_TEST_DATABASE_URL: postgres://admin:authkit_ci@127.0.0.1:5432/authkit_ci?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: authkit_ci
          POSTGRES_DB: authkit_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: auth-ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: auth-ui/pnpm-lock.yaml
      - run: pnpm --dir auth-ui install --frozen-lockfile --ignore-scripts
      - name: Generate canonical contracts and format UI source
        run: |
          go run ./internal/cmd/migrate -dsn "$AUTHKIT_TEST_DATABASE_URL" -schema profiles -legacy-tenant-id 00000000-0000-4000-8000-000000000001
          export SQLC_DATABASE_URL="${AUTHKIT_TEST_DATABASE_URL}&options=-csearch_path%3Dprofiles%2Cpublic"
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f internal/db/sqlc.yaml
          go generate ./internal/httpapi
          pnpm --dir auth-ui exec prettier --write src
      - name: Capture exact-source artifacts without writing to GitHub
        run: |
          mkdir -p .reports/generated-contracts
          git rev-parse HEAD > .reports/generated-contracts/source-sha.txt
          git diff --binary -- internal/db api auth-ui/src > .reports/generated-contracts/contract.patch
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          out = root / '.reports/generated-contracts'
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--', 'internal/db', 'api', 'auth-ui/src']).decode().splitlines()
          (out / 'files.json').write_text(json.dumps(paths, indent=2) + '\n')
          for name in paths:
              source = root / name
              if source.is_file():
                  destination = out / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, destination)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-contracts
          path: .reports/generated-contracts/
          if-no-files-found: error
          retention-days: 7
