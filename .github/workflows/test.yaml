name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly query-plan/perf seed at 100k and 1M rows (query-perf job only).
    - cron: "0 5 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

# Run the JavaScript-based actions (checkout, setup-go, harden-runner) on
# Node.js 24. The pinned action versions still declare Node 20, which GitHub
# deprecates on 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # repo-token only authenticates the release lookup (rate limits); the
      # workflow's GITHUB_TOKEN is contents:read.
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # sqlc generate must produce no diff (and no untracked file) under
      # internal/db, and sqlc vet (db-prepare rule) PREPAREs every query against
      # compose Postgres (test-db-ready starts Postgres/Redis and applies the
      # schema directly; no issuer image or HTTP startup barrier).
      - name: sqlc generate + vet, fail on drift
        run: task sqlc-check

      # AUTHKIT_TEST_REQUIRE_DB=1 turns every DB-gated t.Skip into a failure and
      # the skip gate fails the job if any test at all reported skip, so a broken
      # compose stack or a renamed env var cannot go green by skipping.
      - name: Run Go tests (skips fail)
        run: task test-ci

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: authhttp/testdata/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install browser workflow dependencies
        working-directory: authhttp/testdata
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Browser cookie session workflow
        run: task test-browser

      - name: Go API and migration compatibility
        run: scripts/check-compatibility.sh

  # EXPLAIN-gated query plans over a seeded scratch database. Too slow for every
  # push (it seeds up to 1M users), so it runs weekly and on demand only.
  query-perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scale: [100000, 1000000]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Query plans at scale ${{ matrix.scale }}
        run: task test-query-perf
        env:
          QUERY_PERF_SCALE: ${{ matrix.scale }}
