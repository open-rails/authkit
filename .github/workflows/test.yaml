name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly query-plan/perf seed at 100k and 1M rows (query-perf job only).
    - cron: "0 5 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

# Run the JavaScript-based actions (checkout, setup-go, harden-runner) on
# Node.js 24. The pinned action versions still declare Node 20, which GitHub
# deprecates on 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build the compose `issuer` image with GHA layer caching instead of
      # rebuilding from scratch inside `docker compose up --build` every run.
      - name: Build issuer image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cmd/authkit-server/Dockerfile
          tags: authkit-issuer:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start migrated authkit-server database and Redis
        run: docker compose up -d --no-build --wait issuer redis

      - name: Wait for authkit-server migrations
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:38080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      # repo-token only authenticates the release lookup (rate limits); the
      # workflow's GITHUB_TOKEN is contents:read.
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # sqlc generate must produce no diff (and no untracked file) under
      # internal/db, and sqlc vet (db-prepare rule) PREPAREs every query against
      # the compose Postgres provisioned above (migrations applied by the
      # issuer's healthz-gated boot; `task sqlc-check` re-runs them idempotently
      # via `authkit-server migrate`).
      - name: sqlc generate + vet, fail on drift
        run: task sqlc-check

      # AUTHKIT_TEST_REQUIRE_DB=1 turns every DB-gated t.Skip into a failure and
      # the skip gate fails the job if any test at all reported skip, so a broken
      # compose stack or a renamed env var cannot go green by skipping.
      - name: Run Go tests (skips fail)
        run: task test-ci

  # EXPLAIN-gated query plans over a seeded scratch database. Too slow for every
  # push (it seeds up to 1M users), so it runs weekly and on demand only.
  query-perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scale: [100000, 1000000]
    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Query plans at scale ${{ matrix.scale }}
        run: task test-query-perf
        env:
          QUERY_PERF_SCALE: ${{ matrix.scale }}
