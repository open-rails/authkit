name: auth-ui

# auth-ui tracks the Go API surface it speaks, so API changes rerun it.
on:
  pull_request:
    branches: [master]
    paths:
      - 'auth-ui/**'
      - '*.go'
      - 'iam/**'
      - 'internal/**'
      - 'provider/**'
      - 'verify/**'
      - 'keys/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/auth-ui.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auth-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-ui:
    name: auth-ui
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: auth-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: auth-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: auth-ui/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: auth-ui/e2e/server/go.mod
          cache-dependency-path: |
            go.sum
            auth-ui/e2e/server/go.sum
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm contract:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-ui-playwright
          path: auth-ui/test-results/
          retention-days: 7
