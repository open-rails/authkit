name: Validate

# One conservative suite selection on the tested PR merge; no duplicate master run.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMAXPROCS: '2'
  AUTHKIT_TEST_DATABASE_URL: postgres://admin:authkit_ci@127.0.0.1:5432/authkit_ci?sslmode=disable
  AUTHKIT_TEST_REDIS_URL: redis://127.0.0.1:6379/0

concurrency:
  group: validate-${{ github.event.pull_request.draft && format('draft-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Suite selection
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      root: ${{ steps.suites.outputs.root }}
      ui: ${{ steps.suites.outputs.ui }}
      workflow: ${{ steps.suites.outputs.workflow }}
      security: ${{ steps.suites.outputs.security }}
      base_ref: ${{ steps.source.outputs.base_ref }}
      base_sha: ${{ steps.source.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested merge
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'CHECK'
          import os, re, subprocess
          from pathlib import Path
          from urllib.parse import quote
          tested = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tested != os.environ['GITHUB_SHA']:
              raise SystemExit('checkout differs from workflow test commit')
          lines = [f'Tested commit: `{tested}`']
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              raw = subprocess.check_output(['git', 'cat-file', '-p', 'HEAD'], text=True)
              parents = [line.split()[1] for line in raw.splitlines() if line.startswith('parent ')]
              expected = [os.environ['PR_BASE_SHA'], os.environ['PR_HEAD_SHA']]
              if parents != expected:
                  raise SystemExit(f'expected PR merge parents {expected}, got {parents}')
              ref = os.environ['PR_BASE_REF']
              if not ref:
                  raise SystemExit('missing PR base ref')
              endpoint = f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/heads/{quote(ref, safe="/")}'
              current = subprocess.check_output(['gh', 'api', endpoint, '--jq', '.object.sha'], text=True).strip()
              if not re.fullmatch(r'[0-9a-f]{40}', current) or current != expected[0]:
                  raise SystemExit('base changed; update the PR and rerun')
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  output.write(f'base_ref={ref}\nbase_sha={current}\n')
              lines += [f'Base: `{expected[0]}`', f'PR head: `{expected[1]}`']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('\n'.join(lines) + '\n')
          CHECK
      - name: Test conservative selection
        run: python3 scripts/test_ci_suites.py
      - name: Select complete suites
        id: suites
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/ci_suites.py --full --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_suites.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

  workflows:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    # Playwright cannot install Chromium on ubuntu-26.04 yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: authkit_ci
          POSTGRES_DB: authkit_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        # Keep the health command as a single executable.  The service
        # container action passes this string through to `docker create`; a
        # shell-quoted command is treated as part of the image reference by
        # that parser and fails before the job starts.
        options: --health-cmd redis-cli --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Use exact release tags for action references in this workflow.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          # Build and security scans run on the latest patched Go 1.26 toolchain;
          # the module also requires Go 1.26.6 as its consumer floor.
          go-version: '1.26.10'
          cache: true
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: internal/apitest/testdata/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: pnpm --dir internal/apitest/testdata install --frozen-lockfile
      - run: pnpm --dir internal/apitest/testdata exec playwright install --with-deps chromium
      - run: scripts/check.sh workflows

  contracts:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: authkit_ci
          POSTGRES_DB: authkit_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Release tags: released migrations are compared with the last one.
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - run: scripts/check.sh contracts

  # Keep the security boundary explicit while avoiding four independent CI
  # workflows. govulncheck covers known reachable dependency vulnerabilities;
  # Trivy covers the full checkout for high and critical dependency, secret and
  # misconfiguration findings. The injected-build-config detector stays with
  # the repositories that carry those build surfaces.
  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    name: Required Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Install and run pinned govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          skip-dirs: '**/.runtime'

  auth-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/auth-ui.yaml

  gate:
    name: ${{ github.event.pull_request.draft && 'Draft PR (CI not requested)' || 'CI Gate' }}
    needs: [changes, workflow-lint, workflows, contracts, security, auth-ui]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected suites and current base
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'CHECK'
          import json, os, re, subprocess
          from urllib.parse import quote
          result = json.loads(os.environ['RESULTS'])
          if result['changes']['result'] != 'success':
              raise SystemExit('suite selection failed or did not run')
          plan = result['changes']['outputs']
          for flag in ('root', 'ui', 'workflow', 'security'):
              if plan.get(flag) not in ('true', 'false'):
                  raise SystemExit(f'missing or invalid suite selection: {flag}')
          required = {'workflows': 'root', 'contracts': 'root', 'security': 'security',
                      'auth-ui': 'ui', 'workflow-lint': 'workflow'}
          for job, flag in required.items():
              expected = 'success' if plan[flag] == 'true' else 'skipped'
              actual = result[job]['result']
              if actual != expected:
                  raise SystemExit(f'{job}: {actual}; expected {expected}')
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              ref, base = os.environ['PR_BASE_REF'], os.environ['PR_BASE_SHA']
              if not ref or not re.fullmatch(r'[0-9a-f]{40}', base):
                  raise SystemExit('missing PR base identity')
              if plan.get('base_ref') != ref or plan.get('base_sha') != base:
                  raise SystemExit('tested base is missing or differs from the event')
              endpoint = f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/heads/{quote(ref, safe="/")}'
              current = subprocess.check_output(['gh', 'api', endpoint, '--jq', '.object.sha'], text=True).strip()
              if current != base:
                  raise SystemExit('base changed during tests; update the PR and rerun')
          CHECK
