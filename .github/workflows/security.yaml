name: Security Scan

# Supply-chain / dependency / SCA security scanning. This complements the
# static analysis in go-sast.yaml (go vet + staticcheck) and codeql.yaml
# (CodeQL dataflow/taint analysis) with the scanners those two don't cover:
# dependency CVEs (govulncheck) and software-composition + secret + misconfig
# scanning (Trivy). Both gate.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly sweep, Monday 08:00 UTC (after go-sast 06:00 and codeql 07:00).
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# Run the JavaScript-based actions (checkout, setup-go, harden-runner) on
# Node.js 24. The pinned action versions still declare Node 20, which GitHub
# deprecates on 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # govulncheck — dependency vulnerability scanning against the Go vuln DB
  # (call-graph aware: only reports vulns this module actually reaches).
  # Fails the build on any KNOWN vulnerability reachable from this module's code.
  # The tree is clean as of the Go 1.26.6 / x/net v0.56.0 bumps.
  # ---------------------------------------------------------------------------
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run govulncheck
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # Trivy — software-composition analysis + filesystem secret/misconfig scanning.
  # Fails on HIGH/CRITICAL fixable findings.
  # ---------------------------------------------------------------------------
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          # .runtime holds the auto-generated, git-ignored dev signing key (never
          # committed, absent from CI checkouts); skip it so a local scan or a
          # stray dev artifact can't trip the secret scanner.
          skip-dirs: '**/.runtime'
