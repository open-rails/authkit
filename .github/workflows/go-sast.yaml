name: Go SAST

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly scan, Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# Run the JavaScript-based actions (checkout, setup-go, harden-runner, upload-sarif)
# on Node.js 24. The pinned action versions still declare Node 20, which GitHub
# deprecates on 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: go-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # go vet + staticcheck — correctness and suspicious constructs
  # ---------------------------------------------------------------------------
  staticcheck:
    name: staticcheck + govet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # `./...` stops at each nested go.mod; the import-path pattern spans every go.work module.
      - run: go vet github.com/open-rails/authkit/...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 # 2026.2.1
      - run: staticcheck github.com/open-rails/authkit/...
