name: SDK

# The browser SDKs track the Go API surface they speak, so API changes rerun them.
on:
  pull_request:
    branches: [master]
    paths:
      - 'sdk/auth-ui/**'
      - '*.go'
      - 'authhttp/**'
      - 'embedded/**'
      - 'internal/**'
      - 'authprovider/**'
      - 'verify/**'
      - 'jwtkit/**'
      - 'ratelimit/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/sdk.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-ui:
    name: auth-ui
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sdk/auth-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/auth-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sdk/auth-ui/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/auth-ui/e2e/server/go.mod
          cache-dependency-path: |
            go.sum
            sdk/auth-ui/e2e/server/go.sum
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm contract:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-ui-playwright
          path: sdk/auth-ui/test-results/
          retention-days: 7
