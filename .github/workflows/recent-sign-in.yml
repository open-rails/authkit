name: Recent sign-in regression

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source commit to test
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMAXPROCS: '2'
  GOWORK: 'off'

jobs:
  recent-sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Verify recent sign-in boundaries
        run: |
          git rev-parse HEAD
          go test -count=1 -run '^TestRecentSignIn' -v ./internal/authflow
