name: sdk-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the packages to (e.g. v0.133.0)
        required: true

permissions:
  contents: write

jobs:
  auth-ui:
    name: Attach @openrails/auth-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: sdk/auth-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/auth-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Version from tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - name: Build release archive
        run: |
          mkdir release
          pnpm pack --pack-destination release
          tar -tzf "release/openrails-auth-ui-${TAG#v}.tgz" | grep -q '^package/dist/index.js$'
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
