name: Release

# A published release publishes @openrails/auth-ui@X.Y.Z to npm, built from the
# release's tag, with provenance. workflow_dispatch publishes an older release's
# attached openrails-auth-ui-X.Y.Z.tgz.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose attached auth-ui tarball to publish to npm (e.g. v1.3.1)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PKG: '@openrails/auth-ui'

jobs:
  auth-ui:
    name: Pack @openrails/auth-ui
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: auth-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: auth-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Version from tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      # pnpm records the package identity at install time. Set the release
      # version first so its before-run dependency check sees the same package.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Source tests run before merge; the release builds and verifies its artifact.
      - run: pnpm build
      - name: Pack
        run: |
          mkdir release
          pnpm pack --pack-destination release
          python3 - <<'VERIFY'
          import json, os, tarfile
          from pathlib import Path
          version = os.environ['TAG'].removeprefix('v')
          path = Path('release') / f'openrails-auth-ui-{version}.tgz'
          with tarfile.open(path) as archive:
              names = set(archive.getnames())
              package = json.load(archive.extractfile('package/package.json'))
              assert package['name'] == os.environ['PKG'] and package['version'] == version
              def check(value):
                  if isinstance(value, dict):
                      for target in value.values(): check(target)
                  elif isinstance(value, str) and value.startswith('./'):
                      target = 'package/' + value[2:]
                      if '*' in target:
                          from fnmatch import fnmatchcase
                          assert any(fnmatchcase(name, target) for name in names), target
                      else:
                          assert target in names, target
              assert 'types' in package['exports']['.']
              check(package['exports'])
              check(package.get('types'))
              assert 'package/dist/index.js' in names
          print(f'Packed {package["name"]}@{version}: exports and types exist in the tarball')
          VERIFY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-ui
          path: auth-ui/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish @openrails/auth-ui to npm
    needs: auth-ui
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.auth-ui.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'release'
        with:
          name: auth-ui
      - name: Download the release's tarball
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "openrails-auth-ui-${TAG#v}.tgz"
      - name: Publish
        run: |
          v="${TAG#v}"
          if npm view "$PKG@$v" version >/dev/null 2>&1; then
            echo "$PKG@$v is already on npm"
            exit 0
          fi
          latest="$(npm view "$PKG" dist-tags.latest 2>/dev/null || true)"
          if [[ "$v" == *-* ]]; then
            dist_tag=next
          elif [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)" != "$v" ]]; then
            dist_tag="release-${v%.*}"
          else
            dist_tag=latest
          fi
          # Provenance names this run's commit, so only a tarball built in it gets one.
          provenance=true
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && provenance=false
          npm publish "openrails-auth-ui-$v.tgz" --tag "$dist_tag" --access public --provenance="$provenance"
