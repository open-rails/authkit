# sqlc configuration (https://docs.sqlc.dev). Paths are relative to this file.
#
# Raw SQL lives in queries/*.sql (one file per domain). The schema source of
# truth is the numbered migrations in ../migrations/postgres. Generated code in
# this directory is committed and never hand-edited. `scripts/check.sh contracts`
# runs `sqlc generate` + `sqlc vet` and fails on drift.
#
# Type mapping policy: uuid -> string, timestamptz -> time.Time, citext ->
# string, inet -> string via host()::text in queries. Nullable columns become
# pointers (emit_pointers_for_null_types).
version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "../migrations/postgres"
    database:
      uri: "${SQLC_DATABASE_URL}"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "db"
        out: "."
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        rename:
          avatar_url: AvatarURL
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "citext"
            go_type: "string"
          - db_type: "citext"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "public.citext"
            go_type: "string"
          - db_type: "public.citext"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          # inet params/columns travel as text (pgx encodes the string form);
          # reads go through host(ip_addr)::text in the queries themselves.
          - db_type: "pg_catalog.inet"
            go_type: "string"
          - db_type: "pg_catalog.inet"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "inet"
            go_type: "string"
          - db_type: "inet"
            nullable: true
            go_type:
              type: "string"
              pointer: true
