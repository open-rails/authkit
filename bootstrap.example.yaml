users:
  - email: operator@example.com
    username: operator
    email_verified: true
    password:
      plaintext: "change-me"
    root_role: owner

remote_applications:
  - slug: tensorhub-runtime
    issuer: https://tensorhub.example
    jwks_uri: https://tensorhub.example/.well-known/jwks.json
    enabled: true

# Dev-only fixtures (#266) — read at every boot (not part of the apply-once
# seed) and honored only when AUTHKIT_ENV is a dev env; a non-dev boot with
# this section set REFUSES to start.
